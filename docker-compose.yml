version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarthospital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build:
      context: .
      dockerfile: SmartHospital.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=smarthospital;Username=postgres;Password=postgres
      UseInMemoryDatabase: "false"
      Jwt__Key: "CHANGE_ME_TO_A_32+_CHAR_SECRET_KEY_FOR_JWT_1234567890"
      AI_API_KEY: ${AI_API_KEY:-}
    ports: ["5000:8080"]
    depends_on: [postgres]
volumes:
  pgdata:
